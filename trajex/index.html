<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Trajex — Fleet Management</title>
<link rel="stylesheet" href="styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="primitives.jsx"></script>
<script type="text/babel" src="charts.jsx"></script>
<script type="text/babel" src="truck.jsx"></script>
<script type="text/babel" src="dashboard.jsx"></script>
<script type="text/babel" src="mobile.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "#4195eb",
  "dark": false,
  "density": "regular",
  "vehicleType": "truck"
}/*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  return (
    <React.Fragment>
      <DesignCanvas>
        <DCSection id="web" title="Trajex — Web Dashboard" subtitle="Gestion de flotte · Desktop">
          <DCArtboard id="dashboard" label="Dashboard · Fleet management" width={1280} height={800}>
            <Dashboard tweaks={t}/>
          </DCArtboard>
        </DCSection>

        <DCSection id="mobile" title="Trajex — Mobile" subtitle="App gestionnaire & conducteur">
          <DCArtboard id="manager" label="Gestionnaire · Vue flotte" width={390} height={844}>
            <IOSDevice dark={t.dark}>
              <IOSStatusBar dark={t.dark}/>
              <div style={{ flex: 1, display:'flex', flexDirection:'column', overflow:'hidden' }}>
                <MobileManager tweaks={t}/>
              </div>
            </IOSDevice>
          </DCArtboard>

          <DCArtboard id="driver" label="Conducteur · Mission active" width={390} height={844}>
            <IOSDevice dark={t.dark}>
              <IOSStatusBar dark={t.dark}/>
              <div style={{ flex: 1, display:'flex', flexDirection:'column', overflow:'hidden' }}>
                <MobileDriver tweaks={t}/>
              </div>
            </IOSDevice>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>

      <TweaksPanel>
        <TweakSection label="Marque"/>
        <TweakColor label="Couleur d'accent" value={t.accent} onChange={(v)=>setTweak('accent', v)}/>
        <TweakToggle label="Mode sombre" value={t.dark} onChange={(v)=>setTweak('dark', v)}/>

        <TweakSection label="Affichage"/>
        <TweakRadio label="Densité" value={t.density}
          options={['compact', 'regular', 'comfy']}
          onChange={(v)=>setTweak('density', v)}/>
        <TweakRadio label="Type de véhicule" value={t.vehicleType}
          options={['truck', 'van']}
          onChange={(v)=>setTweak('vehicleType', v)}/>
      </TweaksPanel>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
